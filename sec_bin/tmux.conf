# ── Secvim tmux integration ──────────────────────────────────────────
# Symlinked to ~/.tmux.conf. Reload with `tmux source-file ~/.tmux.conf`.
#
# Prefix: C-a. This frees C-b for Neovim's sidebar toggle. Press C-a twice to
# send a literal C-a to the pane (needed for Neovim's number increment).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal behaviour
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB"
setw -g mode-keys vi

# ── smart-splits: C-hjkl moves across Neovim windows and tmux panes ──
# The backend sets @pane-is-vim while Neovim owns the pane. When it is set,
# tmux forwards the key to Neovim; otherwise tmux moves between its own panes.
bind -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { select-pane -D }
bind -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { select-pane -U }
bind -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }

# M-hjkl resizes Neovim splits, then tmux panes at the edge.
bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { resize-pane -R 3 }

# Copy mode: move between panes directly.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Panes (prefix first) ─────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind z resize-pane -Z

# ── Windows, the tmux equivalent of tabs (prefix first) ──────────────
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind & confirm-before -p "kill-window #W? (y/n)" kill-window
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# ── Sessions and config (prefix first) ───────────────────────────────
bind s choose-tree -Zs
bind ( switch-client -p
bind ) switch-client -n
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
