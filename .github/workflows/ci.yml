name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install StyLua
        run: |
          curl -fsSL -o /tmp/stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip -q /tmp/stylua.zip -d /tmp/stylua
          sudo install -m 0755 /tmp/stylua/stylua /usr/local/bin/stylua

      - name: Check Lua formatting
        run: stylua --check lua/

      - name: Shellcheck installer
        run: shellcheck install.sh

      - name: Validate help tags
        run: |
          test -s doc/tags
          grep -q '^secvim[[:space:]]' doc/tags
